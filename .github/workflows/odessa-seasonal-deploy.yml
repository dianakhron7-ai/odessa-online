name: Odessa Online Seasonal Homepage

on:
  push:
    paths:
      - '.github/workflows/odessa-seasonal-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odessa-seasonal-homepage
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processor
        run: python -m pip install --quiet Pillow
      - name: Apply seasonal homepage changes
        run: python scripts/apply-odessa-home.py
      - name: Check JavaScript syntax and section images
        run: |
          node --check seasonal.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert '<link rel="stylesheet" href="seasonal.css">' in s
          assert '<script defer src="seasonal.js"></script>' in s
          for season in ['spring','summer','autumn','winter']:
              assert (Path('assets/seasons')/(season+'.jpg')).is_file()
          m=re.search(r'const CITY = \[\n([\s\S]*?)\n\];',s)
          assert m
          imgs=re.findall(r"(?<=hero:)'([a-z]\d+)'|(?<=,)'([a-z]\d+)'(?=\])",m.group(1))
          ids=[a or b for a,b in imgs]
          assert len(ids)==len(set(ids)), 'Duplicate image ids in categories'
          print('Seasonal homepage and category image audit passed',len(ids))
          PY
      - name: Publish to GitHub Pages repository
        run: |
          git config user.name 'odessa-guide-updater'
          git config user.email 'odessa-guide-updater@users.noreply.github.com'
          git add index.html assets/seasons/
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Enable Odessa four-season homepage, unique category photos and visitor badge'
            git push origin HEAD:main
          fi
