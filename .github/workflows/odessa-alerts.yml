name: Odessa Alerts Manual Backup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odessa-alerts-manual-backup
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 62

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Monitor odessagolovna every 10 seconds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-1004426768141'
          ALERT_SOURCES: 'odessagolovna'
          CHECK_INTERVAL_MS: '10000'
          RUN_FOR_MS: '3540000'
        run: node scripts/odessa-alerts.mjs

      - name: Save alert state
        if: always()
        run: |
          if git diff --quiet -- data/odessa-alert-state.json; then
            echo "No alert state changes"
            exit 0
          fi
          git config user.name "odessa-alert-bot"
          git config user.email "odessa-alert-bot@users.noreply.github.com"
          git add data/odessa-alert-state.json
          git commit -m "Update Odessa alert state"
          git pull --rebase origin main
          git push
