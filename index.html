.page{min-height:100vh;background:linear-gradient(180deg,#071b30,#020b14);padding:32px 14px 40px}.top{display:flex;align-items:center;gap:12px;position:sticky;top:10px;z-index:5;padding:10px 0 16px;background:linear-gradient(#071b30 72%,transparent)}.back{border:1px solid #55ef98;border-radius:15px;background:linear-gradient(180deg,#2cbc70,#15904d);box-shadow:0 5px 14px rgba(0,0,0,.32);color:#fff;padding:12px 18px;font-weight:900}.page h2{margin:0;font-size:24px}.subgrid{display:grid;gap:10px}.sub{width:100%;min-height:76px;text-align:left;border:1.5px solid #2dcff8;border-radius:17px;background:linear-gradient(135deg,#0c3156,#071d35);color:#fff;padding:13px 48px 13px 14px;position:relative;box-shadow:0 0 8px rgba(38,205,255,.24),0 5px 14px rgba(0,0,0,.34)}.sub b{display:block;font-size:18px}.sub small{display:block;color:#d1e7f3;margin-top:4px}.sub:after{content:'›';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:34px}.detail{background:#0a2541;border:1px solid #2ecff5;border-radius:20px;padding:17px}.detail p{color:#d2e4ef;line-height:1.5}.map{display:block;width:100%;border:0;border-radius:15px;background:#1794d0;color:#fff;padding:14px;text-align:center;text-decoration:none;font-weight:900;margin-top:12px}.group-link{background:#218bc2}.note{margin-top:12px;color:#9fbdd0;font-size:13px;text-align:center}
@media(max-width:430px){.hero{min-height:440px}.badge{width:91px;height:91px;font-size:12px}.badge span{font-size:23px}.kicker{font-size:20px;margin-left:92px}.title{font-size:49px;margin-left:72px}.online{font-size:40px;margin-left:115px}.slogan{font-size:18px;margin-left:82px}.live{left:9px;right:9px;gap:6px}.live-card{min-height:80px;padding:8px}.live-card b{font-size:12px}.live-card strong{font-size:22px}.live-card small{font-size:10px}.live-card.shelter{font-size:14px}.shield{font-size:30px}.content{padding:10px 9px 26px}.grid{gap:8px}.tile{height:112px;border-radius:17px}.tile b{font-size:16px}.tile small{font-size:10px}.tile .icon{font-size:25px}.search{height:58px}.search input{font-size:15px}.search-icon{font-size:31px}.search button{width:42px;height:42px}.ad{height:64px;font-size:20px}}

 {id:'utilities',title:'Коммунальные службы',icon:'💡',sub:'Свет · Вода · Газ · Тепло',cls:'gold',img:'url(https://images.unsplash.com/photo-1585704032915-c3400ca199e7?auto=format&fit=crop&w=700&q=80)',items:[
  ['Электроснабжение','Отключения света и аварийные службы'],['Водоканал','Вода, аварии и обращения'],['Газовая служба','Газ и аварийные контакты'],['Отопление','Теплоснабжение и обращения'],['Управляющие компании','ЖКС и обслуживание домов'],['Вывоз мусора','Коммунальная уборка и отходы'],['Аварийные службы','Срочные городские службы'],['Укрытия','Ближайшие безопасные места']]},

  ['Все вакансии','Актуальные вакансии в Одессе'],['Работа без опыта','Вакансии для начинающих'],['Подработка','Временная и частичная занятость'],['Удалённая работа','Работа из дома и онлайн'],['Рестораны и гостиницы','Повара, официанты и персонал'],['Водители и доставка','Такси, курьеры и перевозки'],['Торговля','Продавцы, кассиры и менеджеры'],['Разместить резюме','Поиск работодателя через группу']]},

let current=null;
const $=s=>document.querySelector(s),homeEl=$('#home'),catEl=$('#category'),detailEl=$('#detail');
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openMap(q){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank')}
function openTelegram(){window.open('https://t.me/Diankaleksandrovna','_blank')}
function renderHome(){const g=$('#grid');g.innerHTML=DATA.map(x=>`<button class="tile ${x.cls}" style="--image:${x.img}" onclick="openCategory('${x.id}')"><span class="icon">${x.icon}</span><span class="txt"><b>${x.title}</b><small>${x.sub}</small></span><span class="arr">›</span></button>`).join('')}
function openCategory(id){current=DATA.find(x=>x.id===id);if(!current)return;$('#catTitle').textContent=current.icon+' '+current.title;$('#subgrid').innerHTML=current.items.map((x,i)=>`<button class="sub" onclick="openDetail(${i})"><b>${esc(x[0])}</b><small>${esc(x[1])}</small></button>`).join('');homeEl.classList.add('hidden');detailEl.classList.add('hidden');catEl.classList.remove('hidden');scrollTo(0,0)}
function openDetail(i){const x=current.items[i];$('#detailTitle').textContent=x[0];$('#detailText').textContent=x[1]+'. Здесь можно быстро найти подходящие организации, специалистов, адреса и расположение на карте.';$('#mapLink').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x[0]+' Одесса');catEl.classList.add('hidden');detailEl.classList.remove('hidden');scrollTo(0,0)}
function home(){catEl.classList.add('hidden');detailEl.classList.add('hidden');homeEl.classList.remove('hidden');scrollTo(0,0)}function backCategory(){detailEl.classList.add('hidden');catEl.classList.remove('hidden');scrollTo(0,0)}
function search(){const raw=$('#q').value.trim(),q=raw.toLocaleLowerCase('ru').replaceAll('ё','е');const box=$('#results');if(!q){box.classList.remove('open');box.innerHTML='';return}let out=[];DATA.forEach(c=>{if((c.title+' '+c.sub).toLocaleLowerCase('ru').replaceAll('ё','е').includes(q))out.push([c,null,c.title,c.sub]);c.items.forEach((x,i)=>{if((x[0]+' '+x[1]).toLocaleLowerCase('ru').replaceAll('ё','е').includes(q))out.push([c,i,x[0],c.title])})});box.innerHTML=out.slice(0,30).map(r=>`<button class="result" data-c="${r[0].id}" data-i="${r[1]===null?'':r[1]}"><b>${esc(r[2])}</b><small>${esc(r[3])}</small></button>`).join('')+`<button class="result external" data-query="${esc(raw)}"><b>🔎 Найти в Одессе: ${esc(raw)}</b><small>Компании, адреса, телефоны и карта</small></button>`;box.classList.add('open');box.querySelectorAll('.result:not(.external)').forEach(b=>b.onclick=()=>{openCategory(b.dataset.c);if(b.dataset.i!=='')openDetail(Number(b.dataset.i));$('#q').value='';box.classList.remove('open')});box.querySelector('.external').onclick=()=>openMap(raw+' Одесса')}
$('#q').addEventListener('input',search);$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});$('#go').onclick=()=>{$('#q').focus();search()};
async function loadLive(){
 try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.4825&longitude=30.7233&current=temperature_2m,weather_code&timezone=Europe%2FKyiv');const j=await r.json();const c=j.current||{};if(Number.isFinite(c.temperature_2m))$('#weatherTemp').textContent=Math.round(c.temperature_2m)+'°C';const names={0:'Ясно',1:'Преимущественно ясно',2:'Переменная облачность',3:'Облачно',45:'Туман',48:'Туман',51:'Морось',53:'Морось',55:'Морось',61:'Дождь',63:'Дождь',65:'Сильный дождь',71:'Снег',73:'Снег',75:'Сильный снег',80:'Ливень',81:'Ливень',82:'Сильный ливень',95:'Гроза'};$('#weatherText').textContent=(names[c.weather_code]||'Погода в Одессе')+' · '+new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}catch(e){$('#weatherText').textContent='Нажмите, чтобы открыть'}
 try{const r=await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json');const a=await r.json();const usd=a.find(x=>x.cc==='USD'),eur=a.find(x=>x.cc==='EUR');if(usd)$('#usdRate').textContent=Number(usd.rate).toFixed(2)+' ₴';if(eur)$('#eurRate').textContent=Number(eur.rate).toFixed(2)+' ₴';$('#rateDate').textContent=(usd&&usd.exchangedate)?'На '+usd.exchangedate:'Официальный курс';}catch(e){$('#rateDate').textContent='Нажмите, чтобы открыть'}
}
renderHome();loadLive();
</script>
