const ATLAS={c:'var(--city)',f:'var(--food)',t:'var(--transport)',x:'var(--services)',y:'var(--places)',m:'var(--medical)',z:'var(--culture)',r:'var(--restaurants)',q:'var(--routes)',a:'var(--additional)',l:'var(--minibuses)',v:'var(--moretransport)',b:'var(--travel)',d:'var(--moreplaces)',e:'var(--morejobs)'};
function photo(id){const atlas=id[0],n=Number(id.slice(1));return `style="--atlas:url(${PHOTO_DATA[id]});"`}
function thumbPhoto(id,seed=0){const positions=['18% 26%','82% 24%','22% 78%','78% 74%','50% 20%','50% 80%','34% 40%','66% 42%','30% 62%','70% 60%'];const sizes=['128%','132%','136%','140%','144%'];const pos=positions[Math.abs(seed)%positions.length],size=sizes[Math.abs(seed)%sizes.length];return `style="--atlas:url(${PHOTO_DATA[id]});background-size:100% 100%,${size};background-position:center,${pos};"`}
function detailPhoto(id,seed=0){const positions=['20% 22%','80% 24%','24% 72%','76% 70%','50% 18%','50% 82%','32% 36%','68% 36%','38% 64%','62% 64%'];const sizes=['134%','138%','142%','146%'];const pos=positions[Math.abs(seed)%positions.length],size=sizes[Math.abs(seed)%sizes.length];return `style="--atlas:url(${PHOTO_DATA[id]});background-size:100% 100%,${size};background-position:center,${pos};"`}
function detailHero(title,img,seed=0,backButton=true,subtitle=''){return `<header class="hero photo" ${detailPhoto(img,seed)}>${brand()}<div class="hero-title"><h1>${escapeHtml(title)}</h1>${subtitle?`<p>${escapeHtml(subtitle)}</p>`:''}</div>${backButton?'<button class="back" data-act="back" aria-label="Назад к предыдущему экрану"><span aria-hidden="true">←</span> Назад</button>':''}</header>`}
function stateHash(x){return '#'+[x.view,x.sid||'',x.ci??'',x.ei??'',x.sp?encodeURIComponent(x.sp):'',x.di??''].join('/')}
function stateFromHash(){const [view,sid,ci,ei,spRaw,diRaw]=String(window.location?.hash||'').replace(/^#/,'').split('/');if(['weather','rates','shelters','favorites'].includes(view))return {view,_depth:0};const s=byId[sid];if(!s)return {view:'home',_depth:0};if(view==='section')return {view,sid,_depth:0};const index=Number(ci);if(!Number.isInteger(index)||index<0||index>=s.items.length)return {view:'home',_depth:0};if(view==='category')return {view,sid,ci:index,_depth:0};const sp=spRaw?decodeURIComponent(spRaw):'';const di=Number(diRaw);if(view==='cliniclist'&&s.id==='medicine'&&sp&&clinicListFor().some(x=>x.clinicGroup===sp))return {view,sid,ci:index,sp,_depth:0};if(view==='doctorlist'&&s.id==='medicine'&&sp&&doctorListFor(sp).length)return {view,sid,ci:index,sp,_depth:0};if(view==='doctordetail'&&s.id==='medicine'&&sp&&Number.isInteger(di)&&di>=0&&di<doctorListFor(sp).length)return {view,sid,ci:index,sp,di,_depth:0};if(view==='diagnosticlist'&&s.id==='medicine'&&sp&&diagnosticListFor(sp).length)return {view,sid,ci:index,sp,_depth:0};if(view==='diagnosticdetail'&&s.id==='medicine'&&sp&&Number.isInteger(di)&&di>=0&&di<diagnosticListFor(sp).length)return {view,sid,ci:index,sp,di,_depth:0};const entryIndex=Number(ei);if(view==='detail'&&Number.isInteger(entryIndex)&&entryIndex>=0&&entryIndex<getEntries(s,...s.items[index]).length)return {view,sid,ci:index,ei:entryIndex,_depth:0};return {view:'home',_depth:0}}
function nav(next){state={...next,_depth:(state._depth||0)+1};history.pushState(state,'',stateHash(state));query='';render();window.scrollTo(0,0)}
function back(){if(state.view==='home')return;if(state._depth>0){history.back();return}state=state.view==='doctordetail'?{view:'doctorlist',sid:state.sid,ci:state.ci,sp:state.sp,_depth:0}:state.view==='doctorlist'?{view:'category',sid:state.sid,ci:state.ci,_depth:0}:state.view==='cliniclist'?{view:'category',sid:state.sid,ci:state.ci,_depth:0}:state.view==='diagnosticdetail'?{view:'diagnosticlist',sid:state.sid,ci:state.ci,sp:state.sp,_depth:0}:state.view==='diagnosticlist'?{view:'category',sid:state.sid,ci:state.ci,_depth:0}:state.view==='detail'?{view:'category',sid:state.sid,ci:state.ci,_depth:0}:state.view==='category'?{view:'section',sid:state.sid,_depth:0}:{view:'home',_depth:0};history.replaceState?.(state,'',stateHash(state));query='';render();window.scrollTo(0,0)}
window.addEventListener('popstate',e=>{state=e.state||stateFromHash();query='';render();window.scrollTo(0,0)});
function brand(){return '<div class="brand" aria-label="Одесса Online"><div>ОДЕССА</div><small>Online</small></div>'}
function hero(title,img,backButton=true,subtitle=''){return `<header class="hero photo" ${photo(img)}>${brand()}<div class="hero-title"><h1>${escapeHtml(title)}</h1>${subtitle?`<p>${escapeHtml(subtitle)}</p>`:''}</div>${backButton?'<button class="back" data-act="back" aria-label="Назад к предыдущему экрану"><span aria-hidden="true">←</span> Назад</button>':''}</header>`}
function searchBox(placeholder){return `<label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(query)}" aria-label="Поиск"></label>`}
function card(title,img,sid,ci){return `<button class="tile photo${title.length>18?' long':''}" ${photo(img)} data-act="${ci===undefined?'section':'category'}" data-sid="${sid}" ${ci===undefined?'':`data-ci="${ci}"`}><span>${escapeHtml(title)}</span><b aria-hidden="true">›</b></button>`}
function geoArt(e,klass='entry-photo'){return `<div class="${klass} location-art" aria-label="Точка на карте"><span aria-hidden="true">⌖</span><small>${escapeHtml(e.lat.toFixed(4))}° · ${escapeHtml(e.lon.toFixed(4))}°</small></div>`}
function entryRow(e,i){if(e.geoOnly)return `<article class="entry geo-entry" data-search="${escapeHtml((e.name+' '+e.address).toLowerCase())}">${e.image?`<div class="entry-photo photo" ${thumbPhoto(e.image,i+11)}></div>`:geoArt(e)}<div class="entry-info"><small class="entry-kind">Место на карте</small><h2>${escapeHtml(e.name)}</h2><p>⌖ &nbsp; ${escapeHtml(addressCaption(e))}</p><div class="row-actions"><button class="gold" data-act="detail" data-ei="${i}">Подробнее <span aria-hidden="true">→</span></button><button class="outline" data-act="map" data-ei="${i}">⌖ &nbsp; На карте</button></div></div></article>`;const time=e.kind==='topic'?'зависит от выбранного места':e.contactHours?e.contactHours:e.hours?e.hours:/онлайн|выезд|диспетчер/i.test(e.address||'')?'Режим работы — на сайте или по телефону':'уточните перед посещением';const phone=e.phone?`<a class="entry-phone" href="tel:${escapeHtml(e.phone.replace(/[^+\d]/g,''))}">☎ ${escapeHtml(e.phone)}${e.phoneLabel?` · ${escapeHtml(e.phoneLabel)}`:''}</a>`:`<button class="entry-phone missing-contact" data-act="${e.website?'website':e.kind==='topic'?'map':'web'}" data-ei="${i}">⌕ ${e.website?'Сайт и контакты':'Найти телефон'}</button>`;return `<article class="entry" data-search="${escapeHtml((e.name+' '+e.address).toLowerCase())}"><div class="entry-photo photo" ${thumbPhoto(e.image,i+11)}></div><div class="entry-info"><small class="entry-kind">${e.kind==='topic'?'Направление':e.website?'Есть страница заведения':'Справочный список'}</small><h2>${escapeHtml(e.name)}</h2><p>⌖ &nbsp; ${escapeHtml(addressCaption(e))}</p>${e.description&&e.description!==e.address?`<p class="entry-description">${escapeHtml(e.description)}</p>`:''}<p class="entry-hours">◷ &nbsp; ${escapeHtml(time)}</p><p class="entry-phone-line">${phone}</p><div class="row-actions"><button class="gold" data-act="detail" data-ei="${i}">Подробнее <span aria-hidden="true">→</span></button><button class="outline" data-act="${hasStreetAddress(e)?'map':e.website?'website':'map'}" data-ei="${i}">${hasStreetAddress(e)?'⌖ &nbsp; На карте':e.website?'↗ &nbsp; Открыть сайт':'⌖ &nbsp; Найти на карте'}</button></div></div></article>`}

function clinicGroupCard(meta,ci){const [name,caption,img]=meta,count=clinicListFor().filter(x=>x.clinicGroup===name).length;return `<button class="tile photo${name.length>18?' long':''}" ${photo(img)} data-act="clinic-group" data-ci="${ci}" data-sp="${escapeHtml(name)}"><span>${escapeHtml(name)}<small class="doctor-count">${count} ${placeWord(count)}</small></span><b aria-hidden="true">›</b></button>`}
function clinicsGroupedView(s,ci){const [name,img]=s.items[ci];return `${hero(name,img,true,s.title)}<main>${searchBox('Найти тип клиники')}<p class="specialty-note">Выберите нужный раздел — государственные, частные или детские клиники. Внутри откроется список учреждений с адресами, телефонами и картой.</p><div class="tiles" id="filterable">${CLINIC_GROUPS.map(meta=>clinicGroupCard(meta,ci)).join('')}</div><p class="empty" hidden>Такого раздела клиник пока нет.</p><button class="secondary" data-act="section" data-sid="medicine">‹ &nbsp; К разделу «Медицина»</button></main>`}
function clinicGroupListView(s,ci,group){const meta=clinicGroupMeta(group),entries=getEntries(s,'Клиники и больницы','m0').map((e,i)=>({e,i})).filter(x=>x.e.clinicGroup===group);return `${hero(group,meta[2],true,'Клиники и больницы')}<main>${searchBox('Найти клинику или больницу')}<p class="specialty-note">${escapeHtml(meta[1])}. В каталоге: ${entries.length} ${placeWord(entries.length)}.</p><div class="listing" id="filterable">${entries.map(x=>entryRow(x.e,x.i)).join('')}</div><p class="empty" hidden>По запросу ничего не найдено.</p><button class="secondary" data-act="category" data-sid="medicine" data-ci="${ci}">‹ &nbsp; Ко всем разделам клиник</button></main>`}
function doctorSpecialtyCard(meta,ci){const [name,caption,img]=meta,count=doctorListFor(name).length;return `<button class="tile photo${name.length>18?' long':''}" ${photo(img)} data-act="doctor-specialty" data-ci="${ci}" data-sp="${escapeHtml(name)}"><span>${escapeHtml(name)}<small class="doctor-count">${count} ${doctorWord(count)}</small></span><b aria-hidden="true">›</b></button>`}
function doctorSpecialtiesView(s,ci){const [name,img]=s.items[ci];return `${hero(name,img,true,s.title)}<main>${searchBox('Найти специальность врача')}<p class="specialty-note">Выберите специальность — откроется список врачей. Каталог объединяет врачей из нескольких клиник Одессы; данные и график приёма проверяйте перед записью.</p><div class="tiles" id="filterable">${DOCTOR_CATALOG_SPECIALTIES.map(meta=>doctorSpecialtyCard(meta,ci)).join('')}</div><p class="empty" hidden>Такой специальности в каталоге пока нет.</p><button class="outline full" data-act="doctors-source-into">Каталог Into-Sana ↗</button><button class="outline full" data-act="doctors-source-on">Каталог ОН Клиник ↗</button><button class="secondary" data-act="section" data-sid="medicine">‹ &nbsp; К разделу «Медицина»</button></main>`}
function doctorRow(d,i,sp){const meta=doctorSpecialtyMeta(sp),visual=doctorVisual(sp,i);return `<article class="entry" data-search="${escapeHtml((d.name+' '+d.specialty+' '+(d.clinic||'')).toLocaleLowerCase('ru'))}"><div class="entry-photo photo" ${thumbPhoto(visual,i+29)} aria-label="${escapeHtml(sp)}"></div><div class="entry-info"><small class="entry-kind">${escapeHtml(d.specialty)}</small><h2>${escapeHtml(d.name)}</h2><p>${escapeHtml(d.clinic||'Медицинский центр')}</p><p class="entry-hours">◷ &nbsp; ${escapeHtml(d.hours||'График — по записи')}</p><div class="row-actions"><button class="gold" data-act="doctor-detail" data-sp="${escapeHtml(sp)}" data-di="${i}">Подробнее <span aria-hidden="true">→</span></button>${hasStreetAddress(d)?`<button class="outline" data-act="doctor-map" data-sp="${escapeHtml(sp)}" data-di="${i}">⌖ &nbsp; На карте</button>`:`<button class="outline" data-act="doctor-site" data-sp="${escapeHtml(sp)}" data-di="${i}">↗ &nbsp; Сайт</button>`}</div></div></article>`}
function doctorListView(s,ci,sp){const meta=doctorSpecialtyMeta(sp),docs=doctorListFor(sp);return `${hero(sp,meta[2],true,'Все врачи')}<main>${searchBox('Найти врача по фамилии')}<p class="specialty-note">${escapeHtml(meta[1])}. В каталоге: ${docs.length} ${doctorWord(docs.length)}.</p><div class="listing" id="filterable">${docs.map((d,i)=>doctorRow(d,i,sp)).join('')}</div><p class="empty" hidden>Врач по запросу не найден.</p><button class="outline full" data-act="doctors-source-into">Проверить Into-Sana ↗</button><button class="outline full" data-act="doctors-source-on">Проверить ОН Клиник ↗</button><button class="secondary" data-act="category" data-sid="medicine" data-ci="${ci}">‹ &nbsp; Ко всем специальностям</button></main>`}
function doctorDetailView(s,ci,sp,di){const meta=doctorSpecialtyMeta(sp),d=doctorListFor(sp)[di];if(!d)return doctorListView(s,ci,sp);const visual=doctorDetailVisual(sp,di);return `<header class="hero photo doctor-detail-hero" ${detailPhoto(visual,di+37)}>${brand()}<div class="hero-title"><h1>${escapeHtml(d.name)}</h1><p>${escapeHtml(d.specialty)}</p></div><button class="back" data-act="back"><span>←</span> Назад</button></header><main><div class="detail-title"><span>Врач в Одессе</span><p>${escapeHtml(d.clinic||'Медицинский центр')}</p></div><div class="facts"><div><span>✚</span><div><strong>Специальность</strong><p>${escapeHtml(d.specialty)}</p></div></div><div><span>⌖</span><div><strong>Приём</strong><p>${escapeHtml(d.address||'Адрес приёма уточняется')}</p></div></div><div><span>◷</span><div><strong>График</strong><p>${escapeHtml(d.hours||'Уточните при записи')}</p></div></div><div><span>✆</span><div><strong>${escapeHtml(d.phoneLabel||'Телефон')}</strong><p>${escapeHtml(d.phone||'Контакты — на сайте клиники')}</p></div></div></div>${d.description?`<p class="doctor-source">${escapeHtml(d.description)}</p>`:''}<div class="detail-actions">${hasStreetAddress(d)?'<button class="gold" data-act="doctor-map">⌖ &nbsp; Открыть на карте <span>›</span></button>':'<button class="gold" data-act="doctor-site">↗ &nbsp; Страница врача / направления <span>›</span></button>'}${d.phone?'<button class="outline" data-act="doctor-call">✆ &nbsp; Позвонить <span>›</span></button>':''}${d.website&&hasStreetAddress(d)?'<button class="outline" data-act="doctor-site">↗ &nbsp; Сайт и информация <span>›</span></button>':''}</div><p class="data-note">Иллюстрация в шапке показывает специальность и не является фотографией врача.</p><button class="secondary" data-act="doctor-specialty" data-sp="${escapeHtml(sp)}" data-ci="${ci}">‹ &nbsp; К списку «${escapeHtml(sp)}»</button></main>`}
function sectionView(s){return `${hero(s.title,s.hero)}<main>${searchBox(s.search)}<div class="tiles" id="filterable">${s.items.map(([name,img],ci)=>card(name,img,s.id,ci)).join('')}</div><p class="empty" hidden>Ничего не найдено. Попробуйте другой запрос.</p><button class="secondary" data-act="home">⌂ &nbsp; На главную</button></main>`}
function diagnosticTypeCard(meta,ci){const [name,caption,img]=meta,count=diagnosticListFor(name).length;return `<button class="tile photo${name.length>18?' long':''}" ${photo(img)} data-act="diagnostic-type" data-ci="${ci}" data-sp="${escapeHtml(name)}"><span>${escapeHtml(name)}<small class="doctor-count">${count} ${placeWord(count)}</small></span><b aria-hidden="true">›</b></button>`}
function diagnosticTypesView(s,ci){const [name,img]=s.items[ci];return `${hero(name,img,true,s.title)}<main>${searchBox('Найти вид диагностики')}<p class="specialty-note">Выберите вид диагностики — откроются лаборатории и медицинские центры, где её проводят.</p><div class="tiles" id="filterable">${DIAGNOSTIC_CATEGORIES.map(meta=>diagnosticTypeCard(meta,ci)).join('')}</div><p class="empty" hidden>Такого вида диагностики пока нет.</p><button class="outline full" data-act="diagnostic-source-into">Диагностика Into-Sana ↗</button><button class="outline full" data-act="diagnostic-source-odrex">Диагностика Odrex ↗</button><button class="secondary" data-act="section" data-sid="medicine">‹ &nbsp; К разделу «Медицина»</button></main>`}
function diagnosticRow(d,i,sp){return `<article class="entry" data-search="${escapeHtml((d.name+' '+d.service+' '+(d.address||'')).toLocaleLowerCase('ru'))}"><div class="entry-photo photo" ${thumbPhoto(diagnosticVisual(sp,i),i+43)}></div><div class="entry-info"><small class="entry-kind">${escapeHtml(d.service||sp)}</small><h2>${escapeHtml(d.name)}</h2><p>⌖ &nbsp; ${escapeHtml(hasStreetAddress(d)?'Адрес: '+d.address:d.address||'Адрес уточняется')}</p><p class="entry-hours">◷ &nbsp; ${escapeHtml(d.hours||'График — по записи')}</p><div class="row-actions"><button class="gold" data-act="diagnostic-detail" data-sp="${escapeHtml(sp)}" data-di="${i}">Подробнее <span aria-hidden="true">→</span></button>${hasStreetAddress(d)?`<button class="outline" data-act="diagnostic-map" data-sp="${escapeHtml(sp)}" data-di="${i}">⌖ &nbsp; На карте</button>`:`<button class="outline" data-act="diagnostic-site" data-sp="${escapeHtml(sp)}" data-di="${i}">↗ &nbsp; Сайт</button>`}</div></div></article>`}
function diagnosticListView(s,ci,sp){const meta=diagnosticMeta(sp),rows=diagnosticListFor(sp);return `${hero(sp,meta[2],true,'Диагностика и анализы')}<main>${searchBox('Найти лабораторию или центр')}<p class="specialty-note">${escapeHtml(meta[1])}. В каталоге: ${rows.length} ${placeWord(rows.length)}.</p><div class="listing" id="filterable">${rows.map((d,i)=>diagnosticRow(d,i,sp)).join('')}</div><p class="empty" hidden>По запросу ничего не найдено.</p><button class="outline full" data-act="diagnostic-source-into">Проверить Into-Sana ↗</button><button class="outline full" data-act="diagnostic-source-odrex">Проверить Odrex ↗</button><button class="secondary" data-act="category" data-sid="medicine" data-ci="${ci}">‹ &nbsp; Ко всем видам диагностики</button></main>`}
function diagnosticDetailView(s,ci,sp,di){const meta=diagnosticMeta(sp),d=diagnosticListFor(sp)[di];if(!d)return diagnosticListView(s,ci,sp);return `${detailHero(d.name,diagnosticDetailVisual(sp,di),di+73,true,sp)}<main><div class="detail-title"><span>Диагностика в Одессе</span><p>${escapeHtml(d.service||sp)}</p></div><div class="facts"><div><span>⌖</span><div><strong>Адрес</strong><p>${escapeHtml(d.address||'Адрес уточняется')}</p></div></div><div><span>◷</span><div><strong>График</strong><p>${escapeHtml(d.hours||'Уточните перед посещением')}</p></div></div><div><span>✆</span><div><strong>${escapeHtml(d.phoneLabel||'Телефон')}</strong><p>${escapeHtml(d.phone||'Контакты — на сайте')}</p></div></div></div><div class="detail-actions">${hasStreetAddress(d)?'<button class="gold" data-act="diagnostic-map">⌖ &nbsp; Открыть на карте <span>›</span></button>':'<button class="gold" data-act="diagnostic-site">↗ &nbsp; Открыть сайт <span>›</span></button>'}${d.phone?'<button class="outline" data-act="diagnostic-call">✆ &nbsp; Позвонить <span>›</span></button>':''}${d.website&&hasStreetAddress(d)?'<button class="outline" data-act="diagnostic-site">↗ &nbsp; Сайт и информация <span>›</span></button>':''}</div><p class="data-note">Фото иллюстративное и соответствует виду диагностики. График и доступность конкретного исследования проверяйте перед записью.</p><button class="secondary" data-act="diagnostic-type" data-sp="${escapeHtml(sp)}" data-ci="${ci}">‹ &nbsp; К списку «${escapeHtml(sp)}»</button></main>`}
function categoryView(s,ci){const [name,img]=s.items[ci];if(s.id==='medicine'&&name==='Все врачи')return doctorSpecialtiesView(s,ci);if(s.id==='medicine'&&name==='Клиники и больницы')return clinicsGroupedView(s,ci);if(s.id==='medicine'&&name==='Диагностика и анализы')return diagnosticTypesView(s,ci);const entries=getEntries(s,name,img);const more=s.id==='medicine'&&name==='Все врачи'?'Открыть полный список врачей':s.id==='transport'&&/Маршрутки|Трамваи|Троллейбусы/.test(name)?'Проверить все маршруты':s.id==='work'?'Смотреть актуальные вакансии':s.id==='events'?'Проверить актуальную афишу':'Посмотреть другие места на карте';return `${hero(name,img,true,s.title)}<main>${entries.length?searchBox('Найти '+name.toLowerCase()):''}<p class="data-note">Фото иллюстративные. Дополнительные точки — © OpenStreetMap contributors (ODbL). Проверяйте актуальность места перед посещением.</p><div class="listing" id="filterable">${entries.length?entries.map(entryRow).join(''):`<div class="no-data">Проверенных организаций с адресом для этого раздела пока нет.</div>`}</div><p class="empty" hidden>По запросу ничего не найдено.</p><button class="outline full" data-act="category-more">${more} ↗</button>${entries.some(e=>e.geoOnly)?'<button class="osm-credit" data-act="osm-license">© OpenStreetMap contributors · лицензия ODbL ↗</button>':''}<button class="secondary" data-act="section" data-sid="${s.id}">‹ &nbsp; К разделу «${escapeHtml(s.title)}»</button></main>`}
function geoDetailView(s,ci,ei,e){const [cat]=s.items[ci],key=s.id+'/'+ci+'/'+ei;return `<header class="hero ${e.image?'photo':'location-hero'}" ${e.image?photo(e.image):''}>${brand()}<div class="hero-title"><h1>${escapeHtml(e.name)}</h1><p>${escapeHtml(cat)}</p></div><button class="back" data-act="back" aria-label="Назад к предыдущему экрану"><span aria-hidden="true">←</span> Назад</button></header><main><div class="detail-title"><span>Место в Одессе</span><p>${escapeHtml(cat)}</p></div><div class="facts"><div><span>⌖</span><div><strong>${e.address?'Адрес':'Геолокация'}</strong><p>${escapeHtml(e.address||`${e.lat.toFixed(6)}, ${e.lon.toFixed(6)}`)}</p></div></div><div><span>◎</span><div><strong>Источник</strong><p>OpenStreetMap · актуальность сведений уточняйте перед посещением</p></div></div></div><div class="detail-actions"><button class="gold" data-act="map">⌖ &nbsp; Открыть на карте <span>›</span></button><button class="outline" data-act="osm-source">◎ &nbsp; Данные о месте <span>›</span></button><button class="outline" data-act="favorite" data-key="${key}">${favorites.has(key)?'♥ Убрать из избранного':'♡ В избранное'}</button></div><button class="secondary" data-act="category" data-sid="${s.id}" data-ci="${ci}">‹ &nbsp; К списку</button></main>`}
function detailView(s,ci,ei){const [cat,img]=s.items[ci],e=getEntries(s,cat,img)[ei];if(!e)return sectionView(s);if(e.geoOnly)return geoDetailView(s,ci,ei,e);let key=s.id+'/'+ci+'/'+ei;const heroImage=s.id==='medicine'?medicalEntryDetailVisual(cat,e,ei):e.image;return `${detailHero(e.name,heroImage,ei+101,true,cat)}<main><div class="detail-title"><span>${e.kind==='topic'?'Направление в Одессе':['Маршрутки','Трамваи','Троллейбусы'].includes(e.type)?'Маршрут в Одессе':'Место в Одессе'}</span><p>${escapeHtml(cat)}</p>${e.clinic?`<p class="clinic-name">${escapeHtml(e.specialty||'')} · ${escapeHtml(e.clinic)}</p>`:''}</div>${e.kind==='topic'?`<div class="info-panel">Откройте карту, чтобы выбрать действующее место, проверить его адрес, часы работы и телефон.</div>`:`<div class="facts"><div><span>⌖</span><div><strong>${['Маршрутки','Трамваи','Троллейбусы'].includes(e.type)?'Маршрут':'Адрес'}</strong><p>${escapeHtml(['Маршрутки','Трамваи','Троллейбусы'].includes(e.type)?e.address:e.address||'Адрес уточняется')}</p></div></div><div><span>◷</span><div><strong>Время работы</strong><p>${escapeHtml(e.contactHours?e.contactHours:e.hours?e.hours:['Маршрутки','Трамваи','Троллейбусы'].includes(e.type)?'Уточните перед поездкой':'Уточните перед посещением')}</p></div></div><div><span>✆</span><div><strong>${escapeHtml(e.phoneLabel||'Телефон')}</strong><p>${e.phone?escapeHtml(e.phone):e.website?'Контакты — на официальном сайте':'Телефон не опубликован'}</p></div></div></div>`}<div class="detail-actions"><button class="gold" data-act="${hasStreetAddress(e)?'map':e.website?'website':'map'}">${hasStreetAddress(e)?'⌖ &nbsp; Открыть на карте':e.website?'↗ &nbsp; Открыть сайт':'⌖ &nbsp; Найти на карте'} <span>›</span></button>${e.phone?'<button class="outline" data-act="call">✆ &nbsp; Позвонить <span>›</span></button>':e.website?'<button class="outline" data-act="website">↗ &nbsp; Сайт и контакты <span>›</span></button>':'<button class="outline" data-act="web">⌕ &nbsp; Найти контакты <span>›</span></button>'}${e.website&&e.phone?'<button class="outline" data-act="website">↗ &nbsp; Сайт и информация <span>›</span></button>':''}<button class="outline" data-act="favorite" data-key="${key}">${favorites.has(key)?'♥ Убрать из избранного':'♡ В избранное'}</button></div><h3 class="related-title">${e.kind==='topic'?'Другие направления':'Похожие места'}</h3><div class="tiles related">${getEntries(s,cat,img).filter((_,i)=>i!==ei).slice(0,2).map((x,i)=>{let index=getEntries(s,cat,img).indexOf(x);return x.geoOnly?`<button class="tile location-art" data-act="detail" data-ei="${index}"><span>${escapeHtml(x.name)}</span><b>›</b></button>`:`<button class="tile photo" ${photo(x.image)} data-act="detail" data-ei="${index}"><span>${escapeHtml(x.name)}</span><b>›</b></button>`}).join('')||card(cat,img,s.id,ci)}</div><button class="secondary" data-act="category" data-sid="${s.id}" data-ci="${ci}">‹ &nbsp; К списку</button></main>`}
function homeView(){return `${hero('Город людей, моря и больших возможностей','c0',false)}<main class="home-content">${searchBox('Что найти в Одессе?')}<div id="search-results" hidden></div><div class="quick"><button data-act="weather"><span class="quick-icon" id="weather-icon">☀</span><span class="quick-copy"><b>Погода</b><small id="home-weather">Обновляем…</small></span><span>›</span></button><button data-act="rates"><span class="quick-icon">▤</span><span class="quick-copy"><b>Курс НБУ</b><small id="home-rates">Обновляем…</small></span><span>›</span></button><button data-act="shelters"><span class="quick-icon">♧</span><span class="quick-copy"><b>Укрытия</b><small>Карта города</small></span><span>›</span></button></div><div class="tiles" id="filterable">${CITY.map(s=>card(s.title,s.hero,s.id)).join('')}</div><p class="empty" hidden>Ничего не найдено.</p><button class="telegram advertise" data-act="advertise"><span>✉</span><span><b>Заказать рекламу</b><small>Напишите @Diankaleksandrovna</small></span><strong>Перейти ›</strong></button><div class="home-footer"><button data-act="home">⌂ Главная</button><button data-act="advertise">✉ Реклама</button><button data-act="favorites">♡ Избранное</button></div></main>`}
function favoritesView(){const items=[...favorites].map(k=>{let [sid,ci,ei]=k.split('/'),s=byId[sid],cat=s?.items[+ci];return s&&cat?{s,ci:+ci,ei:+ei,e:getEntries(s,cat[0],cat[1])[+ei]}:null}).filter(x=>x&&x.e);return `${hero('Избранное','c15')}<main>${items.length?items.map(x=>`<button class="favorite-row" data-act="detail" data-sid="${x.s.id}" data-ci="${x.ci}" data-ei="${x.ei}">${escapeHtml(x.e.name)} <span>›</span></button>`).join(''):'<div class="no-data">Сохранённые места появятся здесь.</div>'}<button class="secondary" data-act="home">⌂ &nbsp; На главную</button></main>`}

function openLink(url){if(url.startsWith('tel:')){window.location.href=url;return}if(window.Telegram?.WebApp){if(url.startsWith('https://t.me/'))return window.Telegram.WebApp.openTelegramLink(url);return window.Telegram.WebApp.openLink(url)}window.open(url,'_blank','noopener,noreferrer')}

app.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,sid=b.dataset.sid||state.sid,ci=Number(b.dataset.ci??state.ci),ei=Number(b.dataset.ei??state.ei),s=byId[sid];if(act==='back')return back();if(act==='home')return nav({view:'home'});if(act==='section'&&s)return nav({view:'section',sid});if(act==='category'&&s)return nav({view:'category',sid,ci});if(act==='clinic-group'){const sp=b.dataset.sp||state.sp;if(sp)return nav({view:'cliniclist',sid:'medicine',ci:Number(b.dataset.ci??state.ci??1),sp});}if(act==='doctor-specialty'){const sp=b.dataset.sp||state.sp;if(sp)return nav({view:'doctorlist',sid:'medicine',ci:Number(b.dataset.ci??state.ci??0),sp});}if(act==='doctor-detail'){const sp=b.dataset.sp||state.sp,di=Number(b.dataset.di);if(sp&&Number.isInteger(di))return nav({view:'doctordetail',sid:'medicine',ci:Number(state.ci??0),sp,di});}if(act==='doctors-source-into')return openLink('https://odessa.into-sana.ua/doctors/');if(act==='doctors-source-on')return openLink('https://onclinic.ua/ru/doctors?city=odessa');if(['doctor-site','doctor-call','doctor-map'].includes(act)){const sp=b.dataset.sp||state.sp,di=Number(b.dataset.di??state.di),d=doctorListFor(sp)[di];if(!d)return;if(act==='doctor-site'&&d.website)return openLink(d.website);if(act==='doctor-call'&&d.phone)return openLink('tel:'+d.phone.replace(/[^+\d]/g,''));if(act==='doctor-map')return searchMap(d.name+', '+(hasStreetAddress(d)?d.address:d.clinic));}if(act==='diagnostic-type'){const sp=b.dataset.sp||state.sp;if(sp)return nav({view:'diagnosticlist',sid:'medicine',ci:Number(b.dataset.ci??state.ci??0),sp});}if(act==='diagnostic-detail'){const sp=b.dataset.sp||state.sp,di=Number(b.dataset.di);if(sp&&Number.isInteger(di))return nav({view:'diagnosticdetail',sid:'medicine',ci:Number(state.ci??0),sp,di});}if(act==='diagnostic-source-into')return openLink('https://odessa.into-sana.ua/directions/diagnostika/');if(act==='diagnostic-source-odrex')return openLink('https://odrex.ua/ua/diagnosis/');if(['diagnostic-site','diagnostic-call','diagnostic-map'].includes(act)){const sp=b.dataset.sp||state.sp,di=Number(b.dataset.di??state.di),d=diagnosticListFor(sp)[di];if(!d)return;if(act==='diagnostic-site'&&d.website)return openLink(d.website);if(act==='diagnostic-call'&&d.phone)return openLink('tel:'+d.phone.replace(/[^+\d]/g,''));if(act==='diagnostic-map')return searchMap(d.name+', '+(hasStreetAddress(d)?d.address:''));}if(act==='detail'&&s)return nav({view:'detail',sid,ci,ei});if(act==='favorites')return nav({view:'favorites'});if(['weather','rates','shelters'].includes(act))return nav({view:act});if(act==='advertise')return openLink('https://t.me/Diankaleksandrovna');if(act==='osm-license')return openLink('https://www.openstreetmap.org/copyright');if(act==='shelter-link')return openLink('https://omr.gov.ua/ua/citizens/map-shelter/');if(act==='weather-link')return openLink('https://www.meteoblue.com/uk/weather/week/odesa_ukraine_698740');if(act==='rates-link')return openLink('https://bank.gov.ua/ua/markets/exchangerates');if(act==='category-more'&&s){const category=s.items[ci][0];if(s.id==='medicine'&&category==='Все врачи')return openLink('https://odessa.into-sana.ua/doctors/');if(s.id==='transport'&&/Маршрутки|Трамваи|Троллейбусы/.test(category))return openLink('https://www.eway.in.ua/ua/cities/odesa/routes');if(s.id==='work')return openLink('https://www.work.ua/jobs-odesa/');if(s.id==='events')return openLink('https://www.google.com/search?q='+encodeURIComponent(category+' Одесса афиша'));return searchMap(category)}if(act==='category-map')return searchMap(s.items[ci][0]);if(act==='category-web')return openLink('https://www.google.com/search?q='+encodeURIComponent(s.items[ci][0]+' Одесса контакты'));if(act==='favorite'){const key=b.dataset.key;favorites.has(key)?favorites.delete(key):favorites.add(key);try{localStorage.setItem('odessa-favorites',JSON.stringify([...favorites]))}catch{}render();return}const entry=getEntries(s,s.items[ci][0],s.items[ci][1])[ei];if(!entry)return;if(act==='map')return entry.geoOnly?openLink('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(entry.lat+','+entry.lon)):searchMap(hasStreetAddress(entry)?entry.name+', '+entry.address:entry.name);if(act==='osm-source'&&entry.osm)return openLink(entry.osm);if(act==='website'&&entry.website)return openLink(entry.website);if(act==='web')return openLink('https://www.google.com/search?q='+encodeURIComponent(entry.name+' Одесса телефон'));if(act==='call'&&entry.phone)return openLink('tel:'+entry.phone.replace(/[^+\d]/g,''))});
function globalHits(q){const hits=[];for(const s of CITY){if(s.title.toLocaleLowerCase('ru').includes(q))hits.push({name:s.title,caption:'Раздел',image:s.hero,act:'section',sid:s.id});for(let ci=0;ci<s.items.length;ci++){const [title,img]=s.items[ci];if(title.toLocaleLowerCase('ru').includes(q))hits.push({name:title,caption:s.title,image:img,act:'category',sid:s.id,ci});if(s.id==='medicine'&&(title==='Все врачи'||title==='Диагностика и анализы'))continue;for(let ei=0,arr=getEntries(s,title,img);ei<arr.length;ei++){const e=arr[ei];if((e.name+' '+e.address+' '+(e.description||'')).toLocaleLowerCase('ru').includes(q))hits.push({name:e.name,caption:title,image:e.image||img,act:'detail',sid:s.id,ci,ei})}}}const med=byId.medicine,allCi=med.items.findIndex(x=>x[0]==='Все врачи');const clinicCi=med.items.findIndex(x=>x[0]==='Клиники и больницы');for(const meta of CLINIC_GROUPS){const [group,,img]=meta;if(group.toLocaleLowerCase('ru').includes(q))hits.push({name:group,caption:'Клиники и больницы',image:img,act:'clinic-group',sid:'medicine',ci:clinicCi,sp:group});for(const [i,e] of clinicListFor().map((e,i)=>[i,e])){if(e.clinicGroup===group&&(e.name+' '+e.address+' '+(e.clinicGroup||'')).toLocaleLowerCase('ru').includes(q))hits.push({name:e.name,caption:group,image:e.image||img,act:'detail',sid:'medicine',ci:clinicCi,ei:i});}}for(const meta of DOCTOR_CATALOG_SPECIALTIES){const [sp,,img]=meta;if(sp.toLocaleLowerCase('ru').includes(q))hits.push({name:sp,caption:'Все врачи',image:img,act:'doctor-specialty',sid:'medicine',ci:allCi,sp});for(let di=0,docs=doctorListFor(sp);di<docs.length;di++){const d=docs[di];if((d.name+' '+d.specialty+' '+(d.clinic||'')).toLocaleLowerCase('ru').includes(q))hits.push({name:d.name,caption:sp,image:doctorVisual(sp,di),act:'doctor-detail',sid:'medicine',ci:allCi,sp,di})}}const diagCi=med.items.findIndex(x=>x[0]==='Диагностика и анализы');for(const meta of DIAGNOSTIC_CATEGORIES){const [sp,,img]=meta;if(sp.toLocaleLowerCase('ru').includes(q))hits.push({name:sp,caption:'Диагностика и анализы',image:img,act:'diagnostic-type',sid:'medicine',ci:diagCi,sp});for(let di=0,rows=diagnosticListFor(sp);di<rows.length;di++){const d=rows[di];if((d.name+' '+d.service+' '+(d.address||'')).toLocaleLowerCase('ru').includes(q))hits.push({name:d.name,caption:sp,image:d.image||img,act:'diagnostic-detail',sid:'medicine',ci:diagCi,sp,di})}}return hits.slice(0,36)}
app.addEventListener('input',ev=>{if(ev.target.id!=='search')return;query=ev.target.value.toLocaleLowerCase('ru').trim();const box=document.getElementById('filterable');if(!box)return;let empty=app.querySelector('.empty');if(state.view==='home'){const results=document.getElementById('search-results');if(!results)return;box.hidden=!!query;results.hidden=!query;if(query){const hits=globalHits(query);results.innerHTML=hits.map(h=>`<button class="search-hit" data-act="${h.act}" data-sid="${h.sid}" ${h.ci===undefined?'':`data-ci="${h.ci}"`} ${h.ei===undefined?'':`data-ei="${h.ei}"`} ${h.sp===undefined?'':`data-sp="${escapeHtml(h.sp)}"`} ${h.di===undefined?'':`data-di="${h.di}"`}><span class="photo" ${photo(h.image)}></span><span><b>${escapeHtml(h.name)}</b><small>${escapeHtml(h.caption)}</small></span><strong>›</strong></button>`).join('');if(empty)empty.hidden=!!hits.length}else{results.innerHTML='';if(empty)empty.hidden=true}return}let visible=0;for(const item of box.children){let match=item.textContent.toLocaleLowerCase('ru').includes(query)||(item.dataset.search||'').includes(query);item.hidden=!match;if(match)visible++}if(empty)empty.hidden=!!visible});
let weatherCache=null,ratesCache=null,weatherPending=null,ratesPending=null;
try{const w=JSON.parse(localStorage.getItem('odessa-weather')||'null'),r=JSON.parse(localStorage.getItem('odessa-rates')||'null');if(w&&Number.isFinite(w.temp)&&Number.isFinite(w.code))weatherCache=w;if(r&&Number.isFinite(r.usd)&&Number.isFinite(r.eur))ratesCache=r}catch{}
function skyIcon(code){return code===0?'☀':code<=3?'☁':code<=48?'≋':code<=82?'☂':code<=86?'❄':'ϟ'}
function showSavedInfo(){if(state.view!=='home')return;if(weatherCache){const el=document.getElementById('home-weather'),icon=document.getElementById('weather-icon');if(el)el.textContent=Math.round(weatherCache.temp)+'° · '+skyDescription(weatherCache.code);if(icon)icon.textContent=skyIcon(weatherCache.code)}if(ratesCache){const el=document.getElementById('home-rates');if(el)el.innerHTML=`<span>USD ${ratesCache.usd.toFixed(2)}</span><span>EUR ${ratesCache.eur.toFixed(2)}</span>`}}

function skyDescription(code){if(code===0)return'Ясно';if(code<=3)return'Облачно';if(code<=48)return'Туман';if(code<=67)return'Дождь';if(code<=77)return'Снег';if(code<=82)return'Осадки';if(code>=95)return'Гроза';return'Погода'}
function getWeather(){if(weatherCache&&Date.now()-weatherCache.saved<15*60*1000)return Promise.resolve(weatherCache);if(weatherPending)return weatherPending;weatherPending=fetch('https://api.open-meteo.com/v1/forecast?latitude=46.4825&longitude=30.7233&current=temperature_2m,weather_code&timezone=Europe%2FKyiv',{signal:AbortSignal.timeout(8500)}).then(r=>{if(!r.ok)throw Error('weather');return r.json()}).then(x=>{const temp=Number(x.current?.temperature_2m),code=Number(x.current?.weather_code);if(!Number.isFinite(temp)||!Number.isFinite(code))throw Error('weather data');const data=weatherCache={temp,code,saved:Date.now()};try{localStorage.setItem('odessa-weather',JSON.stringify(data))}catch{}return data}).finally(()=>{weatherPending=null});return weatherPending}
function getRates(){if(ratesCache&&Date.now()-ratesCache.saved<6*60*60*1000)return Promise.resolve(ratesCache);if(ratesPending)return ratesPending;ratesPending=fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json',{signal:AbortSignal.timeout(8500)}).then(r=>{if(!r.ok)throw Error('rates');return r.json()}).then(rows=>{const usd=rows.find(x=>x.cc==='USD'),eur=rows.find(x=>x.cc==='EUR');if(!usd||!eur||!Number.isFinite(Number(usd.rate))||!Number.isFinite(Number(eur.rate)))throw Error('rates data');const data=ratesCache={usd:Number(usd.rate),eur:Number(eur.rate),date:String(usd.exchangedate||''),saved:Date.now()};try{localStorage.setItem('odessa-rates',JSON.stringify(data))}catch{}return data}).finally(()=>{ratesPending=null});return ratesPending}
async function loadWeather(){try{const x=await getWeather();if(state.view==='home'){const el=document.getElementById('home-weather');if(el)el.textContent=Math.round(x.temp)+'° · '+skyDescription(x.code);const icon=document.getElementById('weather-icon');if(icon)icon.textContent=skyIcon(x.code)}if(state.view==='weather'){const el=document.getElementById('info-result');if(el)el.innerHTML=`<strong>${Math.round(x.temp)}°C</strong><p>${skyDescription(x.code)} · температура воздуха в Одессе</p><small>Источник: Open-Meteo</small>`}}catch{if(state.view==='home'){const el=document.getElementById('home-weather');if(el)el.textContent=weatherCache?'Нет сети · '+Math.round(weatherCache.temp)+'°':'Нет данных'}if(state.view==='weather'){const el=document.getElementById('info-result');if(el)el.textContent='Погода сейчас недоступна. Откройте прогноз по кнопке ниже.'}}}
async function loadRates(){try{const x=await getRates();if(state.view==='home'){const el=document.getElementById('home-rates');if(el)el.innerHTML=`<span>USD ${x.usd.toFixed(2)}</span><span>EUR ${x.eur.toFixed(2)}</span>`}if(state.view==='rates'){const el=document.getElementById('info-result');if(el)el.innerHTML=`<div class="rate-line"><b>USD</b><span>${x.usd.toFixed(2)} ₴</span></div><div class="rate-line"><b>EUR</b><span>${x.eur.toFixed(2)} ₴</span></div><small>Официальный курс НБУ · ${escapeHtml(x.date)}</small>`}}catch{if(state.view==='home'){const el=document.getElementById('home-rates');if(el)el.textContent=ratesCache?`Нет сети · USD ${ratesCache.usd.toFixed(2)}`:'Нет данных'}if(state.view==='rates'){const el=document.getElementById('info-result');if(el)el.textContent='Курс сейчас недоступен. Откройте официальный сайт НБУ.'}}}
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch{}
state=stateFromHash();history.replaceState?.(state,'',stateHash(state));
render();
</script></body></html>
