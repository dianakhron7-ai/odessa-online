function home(){catEl.classList.add('hidden');detailEl.classList.add('hidden');homeEl.classList.remove('hidden');scrollTo(0,0)}function backCategory(){detailEl.classList.add('hidden');catEl.classList.remove('hidden');scrollTo(0,0)}
function search(){const raw=$('#q').value.trim(),q=raw.toLocaleLowerCase('ru').replaceAll('ё','е');const box=$('#results');if(!q){box.classList.remove('open');box.innerHTML='';return}let out=[];DATA.forEach(c=>{if((c.title+' '+c.sub).toLocaleLowerCase('ru').replaceAll('ё','е').includes(q))out.push([c,null,c.title,c.sub]);c.items.forEach((x,i)=>{if((x[0]+' '+x[1]).toLocaleLowerCase('ru').replaceAll('ё','е').includes(q))out.push([c,i,x[0],c.title])})});box.innerHTML=out.slice(0,30).map(r=>`<button class="result" data-c="${r[0].id}" data-i="${r[1]===null?'':r[1]}"><b>${esc(r[2])}</b><small>${esc(r[3])}</small></button>`).join('')+`<button class="result external" data-query="${esc(raw)}"><b>🔎 Найти в Одессе: ${esc(raw)}</b><small>Компании, адреса, телефоны и карта</small></button>`;box.classList.add('open');box.querySelectorAll('.result:not(.external)').forEach(b=>b.onclick=()=>{openCategory(b.dataset.c);if(b.dataset.i!=='')openDetail(Number(b.dataset.i));$('#q').value='';box.classList.remove('open')});box.querySelector('.external').onclick=()=>openMap(raw+' Одесса')}
$('#q').addEventListener('input',search);$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});$('#go').onclick=()=>{$('#q').focus();search()};
async function loadLive(){
 try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.4825&longitude=30.7233&current=temperature_2m,weather_code&timezone=Europe%2FKyiv');const j=await r.json();const c=j.current||{};if(Number.isFinite(c.temperature_2m))$('#weatherTemp').textContent=Math.round(c.temperature_2m)+'°C';const hero=$('#weatherHero'),code=Number(c.weather_code);hero.classList.remove('weather-sunny','weather-cloudy','weather-rain');hero.classList.add(code<=1?'weather-sunny':(code<=48?'weather-cloudy':'weather-rain'));const names={0:'Ясно',1:'Преимущественно ясно',2:'Переменная облачность',3:'Облачно',45:'Туман',48:'Туман',51:'Морось',53:'Морось',55:'Морось',61:'Дождь',63:'Дождь',65:'Сильный дождь',71:'Снег',73:'Снег',75:'Сильный снег',80:'Ливень',81:'Ливень',82:'Сильный ливень',95:'Гроза'};$('#weatherText').textContent=(names[c.weather_code]||'Погода в Одессе')+' · '+new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}catch(e){$('#weatherText').textContent='Нажмите, чтобы открыть'}
 try{const r=await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json');const a=await r.json();const usd=a.find(x=>x.cc==='USD'),eur=a.find(x=>x.cc==='EUR');if(usd)$('#usdRate').textContent=Number(usd.rate).toFixed(2)+' ₴';if(eur)$('#eurRate').textContent=Number(eur.rate).toFixed(2)+' ₴';$('#rateDate').textContent=(usd&&usd.exchangedate)?'На '+usd.exchangedate:'Официальный курс';}catch(e){$('#rateDate').textContent='Нажмите, чтобы открыть'}
}
renderHome();loadLive();
</script>
</body></html>
